<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organizer Dashboard - EventPass</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-container">
      <a href="/" class="site-title">
        <span>🎟️ EventPass <span style="font-size: 0.8rem; font-weight: normal; color: var(--gray-600);">(Organizer Portal)</span></span>
      </a>
      <nav id="site-nav" style="display: flex; gap: 0.75rem; align-items: center;">
        <a href="/" class="btn btn-sm btn-secondary">Public Site</a>
        <button id="logout-btn" class="btn btn-sm btn-secondary">Log Out</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
      <div>
        <h1>Organizer Dashboard</h1>
        <p id="organizer-welcome">Manage your events, add ticket tiers, and publish to the public event catalog.</p>
      </div>
      <button id="show-create-modal-btn" class="btn btn-primary">
        + Create New Event
      </button>
    </div>

    <!-- Create Event Card/Form (hidden by default) -->
    <div id="create-event-panel" style="display: none; background: #ffffff; padding: 2rem; border-radius: var(--radius); border: 2px solid var(--primary); margin-bottom: 2.5rem; box-shadow: var(--shadow);">
      <h2>Create New Event</h2>
      <form id="create-event-form">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 1rem;">
          <div class="form-group">
            <label for="event-title">Event Title</label>
            <input type="text" id="event-title" required placeholder="e.g. Lagos Tech Meetup">
          </div>
          <div class="form-group">
            <label for="event-city">City</label>
            <input type="text" id="event-city" required placeholder="e.g. Lagos, Abuja">
          </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 1.5rem;">
          <div class="form-group">
            <label for="event-venue">Venue Name / Address</label>
            <input type="text" id="event-venue" required placeholder="e.g. Yaba Innovation Hub">
          </div>
          <div class="form-group">
            <label for="event-starts-at">Start Date & Time</label>
            <input type="datetime-local" id="event-starts-at" required>
          </div>
        </div>

        <div style="display: flex; gap: 0.75rem; justify-content: flex-end;">
          <button type="button" id="cancel-create-btn" class="btn btn-secondary">Cancel</button>
          <button type="submit" id="submit-event-btn" class="btn btn-primary">Save Draft Event</button>
        </div>
      </form>
    </div>

    <!-- Status & Events List -->
    <div id="status-container" style="text-align: center; padding: 2rem;"></div>
    <div id="events-list" style="display: flex; flex-direction: column; gap: 2rem;"></div>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 EventPass Ticketing. Course Capstone Project.</p>
  </footer>

  <script type="module" src="/js/pages/organizer.js"></script>
</body>
</html>
